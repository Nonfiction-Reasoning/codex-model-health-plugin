[package]
name = "codex-model-health-plugin"
version = "0.2.2"
edition = "2024"
rust-version = "1.99"

[features]
bundled-engine = []

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "62516d976972a979e55eb3d13782051ffaca2ff0", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }
tokio = { version = "1.52.3", default-features = false, features = ["io-std", "io-util", "macros", "rt", "sync", "time", "process"] }

[profile.release]
strip = "symbols"
lto = "thin"
panic = "abort"
